<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NazaGestão IA — Gestão para Gráfica</title>
<style>
:root{--bg:#f4f6fb;--panel:#fff;--ink:#172033;--muted:#68738a;--line:#e4e8f0;--brand:#5146e5;--brand2:#776df2;--green:#12805c;--red:#c43d52;--amber:#a86b00;--shadow:0 10px 28px #25315b0c}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font:14px/1.45 Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif;color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:10px 13px;font-weight:650}.primary{background:var(--brand);color:#fff}.soft{background:#eeedff;color:var(--brand)}.plain{background:#f1f3f8;color:var(--ink)}.danger{background:#fff0f1;color:var(--red)}.app{display:grid;grid-template-columns:245px 1fr;min-height:100vh}.side{background:#171b31;color:#e9ebff;padding:22px 14px;display:flex;flex-direction:column;gap:8px}.logo{font-size:20px;font-weight:850;padding:4px 10px 22px;letter-spacing:-.5px}.logo span{color:#9d96ff}.side small{color:#9ba3c2;padding:10px 12px 4px;font-size:10px;letter-spacing:1.5px}.nav{display:flex;gap:12px;align-items:center;text-align:left;color:#c7cbe0;background:transparent;width:100%;padding:11px 12px;font-weight:550}.nav.active,.nav:hover{background:#303454;color:white}.side-foot{margin-top:auto;color:#9ba3c2;padding:12px;font-size:12px}.main{min-width:0}.top{height:76px;display:flex;align-items:center;justify-content:space-between;padding:0 30px;background:#ffffffd9;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:3;backdrop-filter:blur(10px)}.top h1{font-size:19px;margin:0}.top p{margin:2px 0 0;color:var(--muted);font-size:12px}.top-actions{display:flex;gap:8px;align-items:center}.content{padding:27px 30px;max-width:1500px;margin:auto}.page-head{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:22px}.page-head h2{margin:0;font-size:24px;letter-spacing:-.6px}.page-head p{margin:5px 0 0;color:var(--muted)}.grid{display:grid;gap:16px}.stats{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:20px}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:19px;box-shadow:var(--shadow);min-width:0}.stat-label{color:var(--muted);font-size:12px;font-weight:650}.stat-value{font-size:27px;font-weight:800;letter-spacing:-.7px;margin:10px 0 4px}.stat-note{font-size:12px;color:var(--muted)}.stat-icon{float:right;background:#eeedff;color:var(--brand);padding:9px;border-radius:11px}.two{grid-template-columns:1.3fr 1fr}.card h3{margin:0 0 15px;font-size:15px}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:620px}th,td{padding:13px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}th{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;background:#fafbfe}td{font-size:13px}tbody tr:last-child td{border-bottom:0}.empty{text-align:center;color:var(--muted);padding:28px}.badge{display:inline-block;padding:5px 9px;border-radius:99px;font-size:11px;font-weight:750;background:#edf0f7;color:#606b80}.badge.ok{background:#e6f7ef;color:var(--green)}.badge.wait{background:#fff4db;color:var(--amber)}.badge.bad{background:#ffeaed;color:var(--red)}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}.search{min-width:220px;flex:1}.field{display:flex;flex-direction:column;gap:6px}.field label{font-size:12px;color:#505b72;font-weight:700}.field input,.field select,.field textarea,input,select,textarea{border:1px solid #dce1eb;border-radius:9px;padding:10px 11px;background:#fff;color:var(--ink);outline:none}.field input:focus,.field select:focus,.field textarea:focus{border-color:#8c85f5;box-shadow:0 0 0 3px #5146e51a}.field textarea{min-height:78px;resize:vertical}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.full{grid-column:1/-1}.modal{position:fixed;inset:0;background:#14182b88;display:none;align-items:center;justify-content:center;padding:18px;z-index:10}.modal.show{display:flex}.modal-box{background:#fff;width:min(760px,100%);max-height:92vh;overflow:auto;border-radius:18px;padding:24px;box-shadow:0 25px 80px #10152b40}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.modal-head h2{margin:0;font-size:20px}.modal-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:22px}.item-line{display:grid;grid-template-columns:2fr .7fr .8fr 35px;gap:8px;margin-bottom:9px;align-items:center}.totalbox{margin:15px 0 0 auto;max-width:320px;background:#f7f7ff;border-radius:12px;padding:14px}.totalrow{display:flex;justify-content:space-between;margin:6px 0}.totalrow.final{border-top:1px solid #dddafa;padding-top:10px;font-size:19px;font-weight:850}.ai-box{background:linear-gradient(135deg,#f0efff,#f8fbff);border:1px solid #dcd9ff;border-radius:16px;padding:20px}.ai-box h3{margin:0 0 5px}.ai-box p{color:var(--muted);margin:0 0 15px}.ai-result{white-space:pre-wrap;background:#fff;border:1px solid #e2e3f5;border-radius:12px;padding:15px;margin-top:14px;min-height:65px}.quick-prompts{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.quick-prompts button{font-size:12px}.notice{padding:12px 14px;background:#fff7df;border:1px solid #f5e2a5;border-radius:12px;color:#785400;margin-bottom:17px;font-size:12px}.pill{font-size:11px;background:#f0f2f8;color:#68738a;padding:5px 8px;border-radius:99px}.muted{color:var(--muted)}.linkbtn{background:transparent;color:var(--brand);padding:5px}.hidden{display:none!important}.mobile-menu{display:none}
@media(max-width:1000px){.app{grid-template-columns:78px 1fr}.side{padding:18px 9px}.logo{font-size:0;padding:8px;text-align:center}.logo:first-letter{font-size:22px}.logo span{font-size:0}.nav{justify-content:center;font-size:0;padding:13px}.nav .ico{font-size:18px}.side small,.side-foot{display:none}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.content{padding:22px 18px}.top{padding:0 18px}}@media(max-width:650px){.app{display:block}.side{display:none}.top{height:68px;padding:0 14px}.top h1{font-size:16px}.top-actions .plain{display:none}.content{padding:18px 12px}.stats,.two{grid-template-columns:1fr}.page-head{align-items:flex-start;flex-direction:column}.form-grid{grid-template-columns:1fr}.full{grid-column:auto}.item-line{grid-template-columns:1.4fr .6fr .8fr 32px}.stat-value{font-size:24px}.top-actions{gap:5px}.top-actions button{padding:9px}}
</style></head>
<body>
<div class="app">
<aside class="side">
<div class="logo">✦ Naza<span>Gestão IA</span></div>
<small>GESTÃO</small>
<button class="nav active" data-page="dashboard"><span class="ico">▦</span> Dashboard</button>
<button class="nav" data-page="orcamentos"><span class="ico">▤</span> Orçamentos</button>
<button class="nav" data-page="faturas"><span class="ico">▧</span> Faturas</button>
<button class="nav" data-page="clientes"><span class="ico">♙</span> Clientes</button>
<button class="nav" data-page="itens"><span class="ico">▣</span> Produtos e serviços</button>
<button class="nav" data-page="receber"><span class="ico">↙</span> Contas a receber</button>
<button class="nav" data-page="pagar"><span class="ico">↗</span> Contas a pagar</button>
<button class="nav" data-page="relatorios"><span class="ico">▥</span> Relatórios</button>
<small>INTELIGÊNCIA</small>
<button class="nav" data-page="ia"><span class="ico">✧</span> Assistente IA</button>
<button class="nav" data-page="empresa"><span class="ico">⚙</span> Perfil da empresa</button>
<div class="side-foot">Versão gratuita • Dados no seu navegador</div>
</aside>
<main class="main">
<header class="top"><div><h1 id="topTitle">Dashboard</h1><p>Gestão simples para sua gráfica</p></div><div class="top-actions"><button class="plain" onclick="exportData()">⇩ Backup</button><button class="primary" onclick="newQuote()">＋ Novo orçamento</button></div></header>
<div class="content" id="content"></div>
</main>
</div>
<div class="modal" id="modal"><div class="modal-box"><div class="modal-head"><h2 id="modalTitle">Novo cadastro</h2><button class="plain" onclick="closeModal()">✕</button></div><div id="modalBody"></div></div></div>
<input type="file" id="importFile" accept=".json,application/json" class="hidden">
<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const money=n=>Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const today=()=>new Date().toISOString().slice(0,10);
const uid=()=>Math.random().toString(36).slice(2,10);
const defaultData={company:{name:'Minha Gráfica',phone:'',email:'',document:'',address:'',city:'',state:'PE',prefix:'ORC',nextQuote:1,nextInvoice:1},clients:[],items:[{id:'i1',name:'Banner',category:'Comunicação visual',priceM2:65,priceUnit:0,description:'Impressão de banner'},{id:'i2',name:'Adesivo',category:'Adesivos',priceM2:55,priceUnit:0,description:'Adesivo impresso'},{id:'i3',name:'Cartão de visita',category:'Papelaria',priceM2:0,priceUnit:45,description:'Pacote com 100 unidades'},{id:'i4',name:'Caneca personalizada',category:'Brindes',priceM2:0,priceUnit:25,description:'Caneca personalizada'}],quotes:[],invoices:[],payables:[]};
let db=loadData(),page='dashboard',searchTerm='';
function loadData(){try{return {...structuredClone(defaultData),...JSON.parse(localStorage.getItem('nazagestao_db')||'{}')}}catch(e){return structuredClone(defaultData)}}
function save(){localStorage.setItem('nazagestao_db',JSON.stringify(db));render()}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function clientName(id){return db.clients.find(c=>c.id===id)?.name||'Cliente não identificado'}
function statusBadge(s){let cls=({'Pago':'ok','Recebido':'ok','Aprovado':'ok','Pendente':'wait','Em aberto':'wait','Vencido':'bad','Rejeitado':'bad','Convertido':'ok','Em produção':'wait'})[s]||'';return `<span class="badge ${cls}">${esc(s||'Pendente')}</span>`}
function setPage(p){page=p;searchTerm='';$$('.nav').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render();window.scrollTo(0,0)}
$$('.nav').forEach(b=>b.addEventListener('click',()=>setPage(b.dataset.page)));
function heading(title,sub,button=''){return `<div class="page-head"><div><h2>${title}</h2><p>${sub||''}</p></div>${button}</div>`}
function cardStat(label,value,note,icon){return `<div class="card"><span class="stat-icon">${icon}</span><div class="stat-label">${label}</div><div class="stat-value">${value}</div><div class="stat-note">${note}</div></div>`}
function render(){let c=$('#content');$('#topTitle').textContent=({dashboard:'Dashboard',orcamentos:'Orçamentos',faturas:'Faturas',clientes:'Clientes',itens:'Produtos e serviços',receber:'Contas a receber',pagar:'Contas a pagar',relatorios:'Relatórios',ia:'Assistente IA',empresa:'Perfil da empresa'})[page]||'NazaGestão IA';c.innerHTML=({dashboard:dashboardPage,orcamentos:quotesPage,faturas:invoicesPage,clientes:clientsPage,itens:itemsPage,receber:receivablePage,pagar:payablesPage,relatorios:reportsPage,ia:aiPage,empresa:companyPage})[page]();if(page==='ia')setupAI();if(page==='relatorios')setupReports()}
function dashboardPage(){let month=today().slice(0,7),qmonth=db.quotes.filter(q=>(q.date||'').startsWith(month)).length,openInv=db.invoices.filter(i=>!['Pago','Recebido'].includes(i.status)),recv=openInv.reduce((a,i)=>a+Number(i.total||0),0),pay=db.payables.filter(p=>p.status!=='Pago').reduce((a,p)=>a+Number(p.value||0),0),received=db.invoices.filter(i=>['Pago','Recebido'].includes(i.status)&&(i.date||'').startsWith(month)).reduce((a,i)=>a+Number(i.total||0),0);
return `${heading('Visão geral','Aqui está o resumo da sua gráfica.',`<button class="primary" onclick="newQuote()">＋ Novo orçamento</button>`)}<div class="grid stats">${cardStat('Orçamentos do mês',qmonth,'Criados neste mês','▤')}${cardStat('Faturas pendentes',openInv.length,'Aguardando pagamento','▧')}${cardStat('Total a receber',money(recv),'Faturas em aberto','↙')}${cardStat('Total a pagar',money(pay),'Despesas pendentes','↗')}</div><div class="grid two"><div class="card"><h3>Orçamentos recentes</h3>${quoteTable(db.quotes.slice().sort((a,b)=>(b.date||'').localeCompare(a.date||'')).slice(0,5),true)}</div><div class="card"><h3>Atalhos</h3><div class="grid" style="grid-template-columns:1fr 1fr"><button class="soft" onclick="setPage('clientes')">♙ Cadastrar cliente</button><button class="soft" onclick="setPage('itens')">▣ Cadastrar item</button><button class="soft" onclick="newInvoice()">▧ Nova fatura</button><button class="soft" onclick="setPage('ia')">✧ Usar IA</button></div><hr style="border:0;border-top:1px solid var(--line);margin:20px 0"><div class="stat-label">Recebido neste mês</div><div class="stat-value">${money(received)}</div><div class="stat-note">Com base nas faturas marcadas como pagas.</div><p class="muted" style="margin-top:18px">💡 Dica: mantenha os custos e preços dos itens atualizados para agilizar seus orçamentos.</p></div></div>`}
function toolbar(placeholder,button,action){return `<div class="toolbar"><input class="search" placeholder="${placeholder}" value="${esc(searchTerm)}" oninput="searchTerm=this.value;render()">${button?`<button class="primary" onclick="${action}">＋ ${button}</button>`:''}</div>`}
function quoteTable(list,compact=false){if(!list.length)return '<div class="empty">Nenhum orçamento cadastrado ainda.</div>';return `<div class="table-wrap"><table><thead><tr><th>Número</th><th>Cliente</th><th>Data</th><th>Valor</th><th>Status</th>${compact?'':'<th>Ações</th>'}</tr></thead><tbody>${list.map(q=>`<tr><td><b>${esc(q.number)}</b></td><td>${esc(clientName(q.clientId))}</td><td>${esc(q.date||'—')}</td><td>${money(q.total)}</td><td>${statusBadge(q.status)}</td>${compact?'':`<td><button class="linkbtn" onclick="viewQuote('${q.id}')">Ver</button> <button class="linkbtn" onclick="convertQuote('${q.id}')">Faturar</button> <button class="linkbtn" onclick="deleteRecord('quotes','${q.id}')">Excluir</button></td>`}</tr>`).join('')}</tbody></table></div>`}
function quotesPage(){let list=db.quotes.filter(q=>(q.number+' '+clientName(q.clientId)+' '+q.status).toLowerCase().includes(searchTerm.toLowerCase()));return `${heading('Orçamentos','Monte propostas com cálculo automático por unidade ou m².',`<button class="primary" onclick="newQuote()">＋ Novo orçamento</button>`)}${toolbar('Buscar por número, cliente ou status','', '')}<div class="card">${quoteTable(list)}</div>`}
function clientsPage(){let list=db.clients.filter(x=>(x.name+' '+(x.phone||'')+' '+(x.document||'')+' '+(x.email||'')).toLowerCase().includes(searchTerm.toLowerCase()));return `${heading('Clientes','Organize contatos e dados dos seus clientes.',`<button class="primary" onclick="editClient()">＋ Novo cliente</button>`)}${toolbar('Buscar cliente por nome, telefone ou CPF/CNPJ','','')}<div class="card"><div class="table-wrap"><table><thead><tr><th>Nome</th><th>CPF/CNPJ</th><th>Telefone</th><th>E-mail</th><th>Cidade</th><th>Ações</th></tr></thead><tbody>${list.length?list.map(x=>`<tr><td><b>${esc(x.name)}</b></td><td>${esc(x.document||'—')}</td><td>${esc(x.phone||'—')}</td><td>${esc(x.email||'—')}</td><td>${esc(x.city||'—')}</td><td><button class="linkbtn" onclick="editClient('${x.id}')">Editar</button><button class="linkbtn" onclick="deleteRecord('clients','${x.id}')">Excluir</button></td></tr>`).join(''):'<tr><td colspan="6" class="empty">Nenhum cliente cadastrado.</td></tr>'}</tbody></table></div></div>`}
function itemsPage(){let list=db.items.filter(x=>(x.name+' '+(x.category||'')+' '+(x.description||'')).toLowerCase().includes(searchTerm.toLowerCase()));return `${heading('Produtos e serviços','Cadastre preços unitários e por metro quadrado.',`<button class="primary" onclick="editItem()">＋ Novo item</button>`)}${toolbar('Buscar produto, categoria ou descrição','','')}<div class="card"><div class="table-wrap"><table><thead><tr><th>Nome</th><th>Categoria</th><th>Preço/m²</th><th>Preço unitário</th><th>Descrição</th><th>Ações</th></tr></thead><tbody>${list.length?list.map(x=>`<tr><td><b>${esc(x.name)}</b></td><td>${esc(x.category||'—')}</td><td>${money(x.priceM2)}</td><td>${money(x.priceUnit)}</td><td>${esc(x.description||'—')}</td><td><button class="linkbtn" onclick="editItem('${x.id}')">Editar</button><button class="linkbtn" onclick="deleteRecord('items','${x.id}')">Excluir</button></td></tr>`).join(''):'<tr><td colspan="6" class="empty">Nenhum item encontrado.</td></tr>'}</tbody></table></div></div>`}
function invoicesPage(){let list=db.invoices.filter(i=>(i.number+' '+clientName(i.clientId)+' '+i.status).toLowerCase().includes(searchTerm.toLowerCase()));return `${heading('Faturas','Registre cobranças e acompanhe os pagamentos.',`<button class="primary" onclick="newInvoice()">＋ Nova fatura</button>`)}${toolbar('Buscar fatura, cliente ou status','','')}<div class="card">${invoiceTable(list)}</div>`}
function invoiceTable(list){return list.length?`<div class="table-wrap"><table><thead><tr><th>Número</th><th>Cliente</th><th>Emissão</th><th>Vencimento</th><th>Valor</th><th>Status</th><th>Ações</th></tr></thead><tbody>${list.map(i=>`<tr><td><b>${esc(i.number)}</b></td><td>${esc(clientName(i.clientId))}</td><td>${esc(i.date||'—')}</td><td>${esc(i.due||'—')}</td><td>${money(i.total)}</td><td>${statusBadge(i.status)}</td><td><button class="linkbtn" onclick="togglePaid('${i.id}')">${['Pago','Recebido'].includes(i.status)?'Reabrir':'Marcar pago'}</button><button class="linkbtn" onclick="deleteRecord('invoices','${i.id}')">Excluir</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Nenhuma fatura cadastrada.</div>'}
function receivablePage(){let list=db.invoices.filter(i=>i.status!=='Pago'&&i.status!=='Recebido');return `${heading('Contas a receber','Acompanhe os valores que seus clientes ainda precisam pagar.')}<div class="grid stats">${cardStat('Em aberto',list.length,'Faturas pendentes','▧')}${cardStat('Total em aberto',money(list.reduce((a,i)=>a+Number(i.total||0),0)),'Saldo a receber','↙')}</div><div class="card">${invoiceTable(list)}</div>`}
function payablesPage(){let list=db.payables.filter(x=>(x.description+' '+(x.supplier||'')+' '+x.status).toLowerCase().includes(searchTerm.toLowerCase()));return `${heading('Contas a pagar','Controle despesas, fornecedores e vencimentos.',`<button class="primary" onclick="editPayable()">＋ Nova conta</button>`)}${toolbar('Buscar despesa ou fornecedor','','')}<div class="card"><div class="table-wrap"><table><thead><tr><th>Descrição</th><th>Fornecedor</th><th>Vencimento</th><th>Categoria</th><th>Valor</th><th>Status</th><th>Ações</th></tr></thead><tbody>${list.length?list.map(x=>`<tr><td><b>${esc(x.description)}</b></td><td>${esc(x.supplier||'—')}</td><td>${esc(x.due||'—')}</td><td>${esc(x.category||'—')}</td><td>${money(x.value)}</td><td>${statusBadge(x.status)}</td><td><button class="linkbtn" onclick="togglePayable('${x.id}')">${x.status==='Pago'?'Reabrir':'Marcar pago'}</button><button class="linkbtn" onclick="deleteRecord('payables','${x.id}')">Excluir</button></td></tr>`).join(''):'<tr><td colspan="7" class="empty">Nenhuma conta a pagar cadastrada.</td></tr>'}</tbody></table></div></div>`}
function reportsPage(){return `${heading('Relatórios','Visualize seus dados e exporte uma cópia para planilhas.')}<div class="grid two"><div class="card"><h3>Resumo financeiro</h3><div id="reportSummary"></div><button class="primary" onclick="exportCSV()">Exportar faturas CSV</button></div><div class="card"><h3>Vendas por status</h3><div id="reportStatuses"></div><button class="soft" onclick="window.print()">Imprimir relatório</button></div></div><div class="card" style="margin-top:16px"><h3>Dados da operação</h3><p>Clientes cadastrados: <b>${db.clients.length}</b></p><p>Produtos/serviços: <b>${db.items.length}</b></p><p>Orçamentos: <b>${db.quotes.length}</b></p><p>Faturas: <b>${db.invoices.length}</b></p><button class="plain" onclick="exportData()">⇩ Baixar backup completo (JSON)</button></div>`}
function setupReports(){let paid=db.invoices.filter(i=>['Pago','Recebido'].includes(i.status)).reduce((a,i)=>a+Number(i.total||0),0),open=db.invoices.filter(i=>!['Pago','Recebido'].includes(i.status)).reduce((a,i)=>a+Number(i.total||0),0),expense=db.payables.reduce((a,i)=>a+Number(i.value||0),0);$('#reportSummary').innerHTML=`<p>Recebido: <b>${money(paid)}</b></p><p>A receber: <b>${money(open)}</b></p><p>Despesas cadastradas: <b>${money(expense)}</b></p><p>Saldo simples (recebido − despesas pagas): <b>${money(paid-db.payables.filter(i=>i.status==='Pago').reduce((a,i)=>a+Number(i.value||0),0))}</b></p>`;let statuses={};db.quotes.forEach(q=>statuses[q.status]=(statuses[q.status]||0)+1);$('#reportStatuses').innerHTML=Object.keys(statuses).length?Object.entries(statuses).map(([s,n])=>`<p>${statusBadge(s)} &nbsp; ${n}</p>`).join(''):'<p class="muted">Ainda não há orçamentos para resumir.</p>'}
function aiPage(){return `${heading('Assistente IA','Ajuda para precificar, vender e organizar sua gráfica.')}<div class="notice">Este assistente funciona gratuitamente com regras locais e modelos prontos; não envia seus dados para um serviço externo. Para IA generativa online, seria necessária uma integração com provedor e sua própria chave/API.</div><div class="ai-box"><h3>✧ Como posso ajudar?</h3><p>Faça uma pergunta ou escolha uma sugestão. A resposta usa os dados cadastrados neste navegador.</p><textarea id="aiQuestion" placeholder="Ex.: Como posso melhorar o lucro dos banners? Ou: crie uma mensagem de orçamento para um cliente..." style="width:100%;min-height:95px"></textarea><div class="quick-prompts"><button class="soft" onclick="askPreset('Analise meu negócio e sugira três prioridades para melhorar a gestão.')">📊 Analisar negócio</button><button class="soft" onclick="askPreset('Me ajude a calcular preço de venda com margem de lucro.')">💰 Precificar produto</button><button class="soft" onclick="askPreset('Escreva uma mensagem profissional de WhatsApp para enviar orçamento.')">💬 Mensagem de venda</button><button class="soft" onclick="askPreset('Crie ideias de promoção para uma gráfica rápida.')">🎯 Ideias de promoção</button></div><button class="primary" onclick="askAI()">Gerar resposta ✧</button><div class="ai-result" id="aiResult">Sua resposta aparecerá aqui.</div></div><div class="grid two" style="margin-top:16px"><div class="card"><h3>📌 Resumo da sua gráfica</h3><p>Clientes: <b>${db.clients.length}</b></p><p>Itens cadastrados: <b>${db.items.length}</b></p><p>Orçamentos em aberto: <b>${db.quotes.filter(q=>q.status==='Pendente').length}</b></p></div><div class="card"><h3>🔐 Privacidade</h3><p class="muted">Os registros são armazenados no localStorage do navegador deste dispositivo. Exporte backups regularmente. Limpar os dados do navegador pode apagar os registros.</p></div></div>`}
function setupAI(){}
function askPreset(t){$('#aiQuestion').value=t;askAI()}
function askAI(){let q=($('#aiQuestion')?.value||'').trim();if(!q){$('#aiResult').textContent='Digite uma pergunta para começar.';return}let l=q.toLowerCase(),out='';
if(/margem|pre[cç]o|precific|lucro|custo/.test(l)){out='GUIA DE PRECIFICAÇÃO\n\n1. Some os custos diretos: material, impressão, acabamento, embalagem e terceirização.\n2. Acrescente custos indiretos proporcionais (energia, aluguel, manutenção e perdas).\n3. Defina a margem desejada. Fórmula para margem sobre o preço: preço = custo total ÷ (1 − margem). Ex.: custo R$ 10,00 e margem de 50% → preço R$ 20,00.\n4. Compare com o mercado e teste o preço mínimo para atacado sem vender abaixo do custo.\n5. Registre o preço no menu Produtos e serviços e revise quando os insumos mudarem.\n\nSe você me informar custo, quantidade e margem desejada, posso calcular um exemplo específico.'}
else if(/whats|mensagem|orçamento|orcamento|cliente/.test(l)){out='MODELO DE MENSAGEM PARA WHATSAPP\n\nOlá! 😊 Tudo bem?\n\nSegue o orçamento solicitado:\n📌 Produto/serviço: [descrever]\n📦 Quantidade: [informar]\n💰 Valor total: R$ [valor]\n⏱️ Prazo de produção: [prazo]\n📅 Validade do orçamento: [data]\n\nPara aprovar, basta responder esta mensagem. Após a confirmação, iniciamos a produção conforme os detalhes combinados.\n\nObrigado por escolher nossa gráfica! Será um prazer atender você. 🖨️\n\nPersonalize os campos entre colchetes antes de enviar.'}
else if(/promo|divulga|venda|marketing/.test(l)){out='IDEIAS DE PROMOÇÃO PARA GRÁFICA RÁPIDA\n\n• Combo para pequenos negócios: cartão de visita + adesivo com preço fechado.\n• Semana do empreendedor: destaque placas Pix, etiquetas e cartões.\n• Brindes personalizados para datas comemorativas, com prazo de encomenda claro.\n• Programa de indicação: benefício pequeno e sustentável para quem indicar um novo cliente.\n• Mostre bastidores da produção em vídeos curtos, com autorização do cliente.\n\nDica: calcule o custo completo antes de oferecer desconto e divulgue prazo, quantidade mínima e condições.'}
else if(/analis|negócio|negocio|gestão|gestao|prioridade/.test(l)){out=`ANÁLISE RÁPIDA DA OPERAÇÃO\n\n• ${db.clients.length} cliente(s) cadastrado(s): mantenha telefone e histórico atualizados.\n• ${db.items.length} produto(s)/serviço(s): revise custos, preços e descrições.\n• ${db.quotes.length} orçamento(s) e ${db.invoices.length} fatura(s): acompanhe propostas sem resposta e cobranças pendentes.\n• Contas a pagar em aberto: ${money(db.payables.filter(x=>x.status!=='Pago').reduce((a,x)=>a+Number(x.value||0),0))}.\n\nTRÊS PRIORIDADES\n1. Registre todos os custos de materiais e terceirização por produto.\n2. Faça follow-up dos orçamentos pendentes após 1–2 dias úteis.\n3. Confira diariamente contas a receber, vencimentos e fluxo de caixa.\n\nEssas recomendações são orientativas e usam os dados locais cadastrados.`}
else{out='POSSO AJUDAR COM:\n\n• Precificação, margem e custo de produtos.\n• Mensagens de orçamento e pós-venda.\n• Ideias de promoção e divulgação.\n• Organização de clientes, produção e contas.\n\nTente uma das sugestões acima ou seja mais específico sobre o objetivo, produto e valores.'}
$('#aiResult').textContent=out}
function companyPage(){let x=db.company;return `${heading('Perfil da empresa','Personalize os dados que aparecem no sistema.')}<div class="card"><form id="companyForm" onsubmit="saveCompany(event)"><div class="form-grid">${field('Nome da gráfica','name',x.name,true)}${field('CNPJ/CPF','document',x.document)}${field('Telefone / WhatsApp','phone',x.phone)}${field('E-mail','email',x.email)}${field('Endereço','address',x.address)}${field('Cidade','city',x.city)}${field('Estado','state',x.state)}${field('Prefixo dos orçamentos','prefix',x.prefix||'ORC')}${field('Próximo número de orçamento','nextQuote',x.nextQuote||1)}${field('Próximo número de fatura','nextInvoice',x.nextInvoice||1)}</div><div class="modal-actions" style="justify-content:flex-start"><button class="primary">Salvar alterações</button><button type="button" class="plain" onclick="exportData()">Exportar dados</button><button type="button" class="plain" onclick="$('#importFile').click()">Importar backup</button><button type="button" class="danger" onclick="resetData()">Apagar todos os dados</button></div></form></div><div class="notice" style="margin-top:16px">Gratuito e editável: o aplicativo é um arquivo HTML que você pode abrir e modificar. Os dados ficam salvos no navegador deste dispositivo; para usar em vários computadores, é necessário adicionar um banco de dados e hospedagem.</div>`}
function field(label,name,value='',required=false,type='text'){return `<div class="field"><label>${label}${required?' *':''}</label><input name="${name}" type="${type}" value="${esc(value??'')}" ${required?'required':''}></div>`}
function saveCompany(e){e.preventDefault();let f=Object.fromEntries(new FormData(e.target));f.nextQuote=Number(f.nextQuote)||1;f.nextInvoice=Number(f.nextInvoice)||1;db.company=f;save();alert('Dados da empresa salvos!')}
function showModal(title,body){$('#modalTitle').textContent=title;$('#modalBody').innerHTML=body;$('#modal').classList.add('show')}
function closeModal(){$('#modal').classList.remove('show')}
function editClient(id){let x=db.clients.find(v=>v.id===id)||{};showModal(id?'Editar cliente':'Novo cliente',`<form id="clientForm" onsubmit="saveClient(event,'${id||''}')"><div class="form-grid">${field('Nome / Razão social','name',x.name||'',true)}${field('CPF/CNPJ','document',x.document||'')}${field('Telefone','phone',x.phone||'')}${field('E-mail','email',x.email||'','', 'email')}${field('Endereço','address',x.address||'')}${field('Cidade','city',x.city||'')}${field('Estado','state',x.state||'PE')}</div><div class="modal-actions"><button type="button" class="plain" onclick="closeModal()">Cancelar</button><button class="primary">Salvar cliente</button></div></form>`)}
function saveClient(e,id){e.preventDefault();let x={id:id||uid(),...Object.fromEntries(new FormData(e.target))};if(id)db.clients=db.clients.map(v=>v.id===id?x:v);else db.clients.push(x);closeModal();save()}
function editItem(id){let x=db.items.find(v=>v.id===id)||{};showModal(id?'Editar item':'Novo produto/serviço',`<form id="itemForm" onsubmit="saveItem(event,'${id||''}')"><div class="form-grid">${field('Nome do item','name',x.name||'',true)}<div class="field"><label>Categoria</label><select name="category"><option>${esc(x.category||'Papelaria')}</option>${['Comunicação visual','Adesivos','Papelaria','Brindes','Sinalização','Impressão','Outros'].map(a=>`<option>${a}</option>`).join('')}</select></div>${field('Preço por m² (R$)','priceM2',x.priceM2||0,false,'number')}${field('Preço unitário (R$)','priceUnit',x.priceUnit||0,false,'number')}<div class="field full"><label>Descrição</label><textarea name="description">${esc(x.description||'')}</textarea></div></div><div class="modal-actions"><button type="button" class="plain" onclick="closeModal()">Cancelar</button><button class="primary">Salvar item</button></div></form>`)}
function saveItem(e,id){e.preventDefault();let f=Object.fromEntries(new FormData(e.target));f.priceM2=Number(f.priceM2)||0;f.priceUnit=Number(f.priceUnit)||0;f.id=id||uid();if(id)db.items=db.items.map(v=>v.id===id?f:v);else db.items.push(f);closeModal();save()}
function newQuote(){if(!db.clients.length){if(confirm('Você ainda não cadastrou clientes. Deseja cadastrar um agora?'))editClient();else setPage('clientes');return}let number=(db.company.prefix||'ORC')+'-'+String(db.company.nextQuote||1).padStart(4,'0');showModal('Novo orçamento',`<form id="quoteForm" onsubmit="saveQuote(event,'${number}')"><div class="form-grid"><div class="field"><label>Cliente *</label><select name="clientId" required>${db.clients.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></div>${field('Data','date',today(),true,'date')}${field('Validade (dias)','validity',7,true,'number')}${field('Prazo de entrega','delivery','3 a 5 dias úteis')}<div class="field full"><label>Itens do orçamento</label><div id="quoteLines"></div><button type="button" class="soft" onclick="addQuoteLine()">＋ Adicionar item</button></div>${field('Frete (R$)','freight',0,false,'number')}<div class="field full"><label>Observações</label><textarea name="notes" placeholder="Detalhes, acabamento, cores, prazo..."></textarea></div></div><div class="totalbox"><div class="totalrow"><span>Subtotal</span><b id="qSubtotal">R$ 0,00</b></div><div class="totalrow"><span>Frete</span><b id="qFreight">R$ 0,00</b></div><div class="totalrow final"><span>Total</span><b id="qTotal">R$ 0,00</b></div></div><div class="modal-actions"><button type="button" class="plain" onclick="closeModal()">Cancelar</button><button class="primary">Salvar orçamento</button></div></form>`);addQuoteLine();$('#quoteForm').freight.addEventListener('input',calcQuote)}
function addQuoteLine(){let el=$('#quoteLines');if(!el)return;let id=uid();el.insertAdjacentHTML('beforeend',`<div class="item-line" data-line="${id}"><select class="ql-item" onchange="calcQuote()"><option value="">Item / serviço</option>${db.items.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select><input class="ql-qty" type="number" min="1" value="1" onchange="calcQuote()" title="Quantidade"><input class="ql-price" type="number" min="0" step=".01" placeholder="Preço" value="0" onchange="calcQuote()" title="Preço unitário"><button type="button" class="danger" onclick="this.parentElement.remove();calcQuote()">×</button><div class="ql-dims" style="grid-column:1/4;display:flex;gap:6px"><input class="ql-w" type="number" step=".01" min="0" placeholder="Largura (m)" oninput="calcQuote()"><input class="ql-h" type="number" step=".01" min="0" placeholder="Altura (m)" oninput="calcQuote()"><span class="pill ql-area" style="align-self:center">0 m²</span></div></div>`);let row=el.querySelector(`[data-line="${id}"]`);row.querySelector('.ql-item').addEventListener('change',()=>{let item=db.items.find(x=>x.id===row.querySelector('.ql-item').value);if(item)row.querySelector('.ql-price').value=item.priceUnit||item.priceM2||0;calcQuote()})}
function calcQuote(){let sub=0;$$('#quoteLines .item-line').forEach(r=>{let qty=Number(r.querySelector('.ql-qty').value)||0,price=Number(r.querySelector('.ql-price').value)||0,w=Number(r.querySelector('.ql-w').value)||0,h=Number(r.querySelector('.ql-h').value)||0,area=w*h;let item=db.items.find(x=>x.id===r.querySelector('.ql-item').value);if(area>0&&item&&item.priceM2>0){price=item.priceM2;r.querySelector('.ql-price').value=price;r.querySelector('.ql-area').textContent=area.toFixed(2)+' m²';sub+=qty*area*price}else{sub+=qty*price;r.querySelector('.ql-area').textContent=area.toFixed(2)+' m²'}});let freight=Number($('#quoteForm')?.freight.value)||0;$('#qSubtotal').textContent=money(sub);$('#qFreight').textContent=money(freight);$('#qTotal').textContent=money(sub+freight)}
function saveQuote(e,number){e.preventDefault();let f=Object.fromEntries(new FormData(e.target)),lines=[];$$('#quoteLines .item-line').forEach(r=>{let item=db.items.find(x=>x.id===r.querySelector('.ql-item').value),qty=Number(r.querySelector('.ql-qty').value)||1,price=Number(r.querySelector('.ql-price').value)||0,w=Number(r.querySelector('.ql-w').value)||0,h=Number(r.querySelector('.ql-h').value)||0,area=w*h;if(item)lines.push({itemId:item.id,name:item.name,qty,price,width:w,height:h,area,total:qty*price*(area>0&&item.priceM2>0?area:1)})});if(!lines.length){alert('Adicione pelo menos um item cadastrado ao orçamento.');return}let total=lines.reduce((a,x)=>a+x.total,0)+Number(f.freight||0);db.quotes.push({id:uid(),number,clientId:f.clientId,date:f.date,validity:Number(f.validity),delivery:f.delivery,freight:Number(f.freight)||0,notes:f.notes,lines,total,status:'Pendente'});db.company.nextQuote=(Number(db.company.nextQuote)||1)+1;closeModal();save()}
function viewQuote(id){let q=db.quotes.find(x=>x.id===id);if(!q)return;showModal('Orçamento '+q.number,`<p><b>Cliente:</b> ${esc(clientName(q.clientId))}</p><p><b>Data:</b> ${esc(q.date)} &nbsp; <b>Validade:</b> ${q.validity} dias &nbsp; <b>Entrega:</b> ${esc(q.delivery||'—')}</p><div class="table-wrap"><table><thead><tr><th>Item</th><th>Qtd.</th><th>Dimensões</th><th>Preço</th><th>Total</th></tr></thead><tbody>${q.lines.map(x=>`<tr><td>${esc(x.name)}</td><td>${x.qty}</td><td>${x.area?x.width+' × '+x.height+' m ('+x.area.toFixed(2)+' m²)':'—'}</td><td>${money(x.price)}</td><td>${money(x.total)}</td></tr>`).join('')}</tbody></table></div><h2 style="text-align:right">Total: ${money(q.total)}</h2><p>${esc(q.notes||'')}</p><div class="modal-actions"><button class="plain" onclick="window.print()">Imprimir</button><button class="primary" onclick="closeModal();convertQuote('${q.id}')">Converter em fatura</button></div>`)}
function convertQuote(id){let q=db.quotes.find(x=>x.id===id);if(!q)return;if(q.status==='Convertido'){alert('Este orçamento já foi convertido.');return}let number='FAT-'+String(db.company.nextInvoice||1).padStart(4,'0');showModal('Converter para fatura',`<form onsubmit="saveInvoiceFromQuote(event,'${id}','${number}')"><div class="form-grid"><div class="field"><label>Cliente</label><input value="${esc(clientName(q.clientId))}" disabled></div>${field('Data de emissão','date',today(),true,'date')}${field('Vencimento','due',today(),true,'date')}<div class="field"><label>Forma de pagamento</label><select name="method"><option>Pix</option><option>Dinheiro</option><option>Cartão de débito</option><option>Cartão de crédito</option><option>Transferência</option><option>Boleto</option></select></div><div class="field full"><label>Valor</label><input value="${q.total}" disabled></div></div><div class="modal-actions"><button type="button" class="plain" onclick="closeModal()">Cancelar</button><button class="primary">Gerar fatura</button></div></form>`)}
function saveInvoiceFromQuote(e,id,number){e.preventDefault();let q=db.quotes.find(x=>x.id===id),f=Object.fromEntries(new FormData(e.target));db.invoices.push({id:uid(),number,clientId:q.clientId,date:f.date,due:f.due,method:f.method,total:q.total,status:'Pendente',description:'Referente ao orçamento '+q.number});q.status='Convertido';db.company.nextInvoice=(Number(db.company.nextInvoice)||1)+1;closeModal();save()}
function newInvoice(){if(!db.clients.length){alert('Cadastre um cliente primeiro.');setPage('clientes');return}let number='FAT-'+String(db.company.nextInvoice||1).padStart(4,'0');showModal('Nova fatura',`<form onsubmit="saveInvoice(event,'${number}')"><div class="form-grid"><div class="field"><label>Cliente *</label><select name="clientId" required>${db.clients.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></div>${field('Data de emissão','date',today(),true,'date')}${field('Vencimento','due',today(),true,'date')}${field('Valor total (R$)','total','0.00',true,'number')}<div class="field"><label>Forma de pagamento</label><select name="method"><option>Pix</option><option>Dinheiro</option><option>Cartão de débito</option><option>Cartão de crédito</option><option>Transferência</option><option>Boleto</option></select></div><div class="field full"><label>Descrição</label><textarea name="description"></textarea></div></div><div class="modal-actions"><button type="button" class="plain" onclick="closeModal()">Cancelar</button><button class="primary">Salvar fatura</button></div></form>`)}
function saveInvoice(e,number){e.preventDefault();let f=Object.fromEntries(new FormData(e.target));f.id=uid();f.number=number;f.total=Number(f.total)||0;f.status='Pendente';db.invoices.push(f);db.company.nextInvoice=(Number(db.company.nextInvoice)||1)+1;closeModal();save()}
function editPayable(){showModal('Nova conta a pagar',`<form onsubmit="savePayable(event)"><div class="form-grid">${field('Descrição','description','',true)}${field('Fornecedor','supplier','')}${field('Vencimento','due',today(),true,'date')}${field('Valor (R$)','value','0.00',true,'number')}<div class="field full"><label>Categoria</label><select name="category"><option>Material</option><option>Fornecedor</option><option>Energia/água</option><option>Aluguel</option><option>Manutenção</option><option>Frete</option><option>Outros</option></select></div></div><div class="modal-actions"><button type="button" class="plain" onclick="closeModal()">Cancelar</button><button class="primary">Salvar conta</button></div></form>`)}
function savePayable(e){e.preventDefault();let f=Object.fromEntries(new FormData(e.target));f.id=uid();f.value=Number(f.value)||0;f.status='Pendente';db.payables.push(f);closeModal();save()}
function togglePaid(id){let i=db.invoices.find(x=>x.id===id);if(i)i.status=['Pago','Recebido'].includes(i.status)?'Pendente':'Pago';save()}
function togglePayable(id){let i=db.payables.find(x=>x.id===id);if(i)i.status=i.status==='Pago'?'Pendente':'Pago';save()}
function deleteRecord(type,id){if(!confirm('Tem certeza que deseja excluir este registro?'))return;db[type]=db[type].filter(x=>x.id!==id);save()}
function exportData(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='backup-nazagestao-'+today()+'.json';a.click();URL.revokeObjectURL(a.href)}
$('#importFile').addEventListener('change',async e=>{let file=e.target.files[0];if(!file)return;try{let x=JSON.parse(await file.text());if(!x.company||!Array.isArray(x.clients)||!Array.isArray(x.items))throw Error('Formato inválido');if(confirm('Importar substituirá os dados atuais. Deseja continuar?')){db={...structuredClone(defaultData),...x};save();alert('Backup importado com sucesso.')}}catch(err){alert('Não foi possível importar. Verifique se o arquivo JSON é um backup válido.')}e.target.value=''});
function exportCSV(){let rows=[['Fatura','Cliente','Emissão','Vencimento','Valor','Status','Pagamento'],...db.invoices.map(i=>[i.number,clientName(i.clientId),i.date,i.due,i.total,i.status,i.method])];let csv=rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(';')).join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}));a.download='faturas-nazagestao.csv';a.click();URL.revokeObjectURL(a.href)}
function resetData(){if(confirm('Isso apagará os cadastros salvos neste navegador. Faça um backup antes. Continuar?')){db=structuredClone(defaultData);save()}}
render();
</script></body></html>
